---
# `sshd -t` (used to validate the config below) needs this directory. With
# socket activation on Ubuntu 24.04 it only exists after the first login.
- name: Ensure the sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Ubuntu reads /etc/ssh/sshd_config.d/*.conf before the main file, and the
# first value wins, so a drop-in is enough and survives package upgrades.
- name: Harden sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Remove cloud-init's password authentication override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh

- name: Keep sshd running
  ansible.builtin.systemd_service:
    name: ssh
    state: started
    enabled: true
