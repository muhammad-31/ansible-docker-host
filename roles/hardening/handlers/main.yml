---
# Ubuntu 24.04 starts sshd through ssh.socket; a daemon-reload regenerates the
# socket from the Port setting, then both units are restarted.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
    daemon_reload: true
  failed_when: false
  notify: Restart ssh service

- name: Restart ssh service
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
