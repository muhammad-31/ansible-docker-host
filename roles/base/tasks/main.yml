---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Keep time in sync with chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Enable automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journal disk usage
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/10-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Configure swap
  ansible.builtin.include_tasks: swap.yml
  when: base_swap_size_mb | int > 0
