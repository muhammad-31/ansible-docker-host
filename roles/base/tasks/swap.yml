---
- name: Create the swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ base_swap_size_mb }}M /swapfile
    creates: /swapfile
  notify:
    - Format swap file
    - Enable swap file

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format and enable new swap now
  ansible.builtin.meta: flush_handlers

- name: Mount swap on boot
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ base_swappiness }}"
    sysctl_file: /etc/sysctl.d/60-swap.conf
    state: present
