[defaults]
inventory = inventories/example/hosts.yml
roles_path = roles
collections_path = ./.collections:~/.ansible/collections
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
host_key_checking = True
retry_files_enabled = False
# Run notified handlers even if a later task fails, so a config change is never
# left un-applied (e.g. daemon.json written but Docker not restarted).
force_handlers = True
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
