---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yamllint + ansible-lint (production profile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools and collections
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint --format github .

      - name: ansible-lint
        run: ansible-lint  # annotates pull requests automatically on GitHub Actions

      - name: Syntax check
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/deploy.yml

  molecule:
    name: Molecule (full server build, idempotence, verify)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: molecule test
        run: |
          set -o pipefail
          molecule test 2>&1 | tee molecule.log
        env:
          PY_COLORS: "0"
          ANSIBLE_FORCE_COLOR: "0"

      # Put the failing tasks on the run summary so they are visible without
      # opening the full log.
      - name: Annotate failures
        if: failure()
        run: |
          msg="$(grep -E -A3 'fatal:|FAILED!|failed=[1-9]|ERROR' molecule.log | tail -n 60 \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          echo "::error title=molecule test failed::${msg}"
